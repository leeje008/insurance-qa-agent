[project]
name = "insurance-qa-agent"
version = "0.1.0"
description = "Insurance Policy Q&A Agent - RAG 기반 보험약관 질의응답 시스템"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=21.2.0",
    # LLM
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-ollama>=0.3",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3",
    "alembic>=1.14",
    # PDF
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    # HTTP
    "httpx>=0.28",
    # Frontend (MVP)
    "streamlit>=1.40",
    # Utils
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1.0",
    "ruff>=0.8",
    "httpx",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["api", "app", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
